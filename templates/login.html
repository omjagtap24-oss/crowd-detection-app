<!DOCTYPE html>
<html>
<head>
<title>PilgrimFlow</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
overflow:hidden;
}

#splash{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#2563eb,#06b6d4);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:9999;
}

#main{
display:none;
height:100vh;
justify-content:center;
align-items:center;
}

.box{
width:330px;
background:white;
padding:30px;
border-radius:15px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:8px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:95%;
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
}

a{
display:block;
margin-top:10px;
cursor:pointer;
color:#2563eb;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div id="splash">
<h1>🛕 PilgrimFlow</h1>
<p>Smart Temple Crowd Guidance</p>
</div>

<div id="main">
<div class="box">

<div id="loginBox">
<h2>Login</h2>
<form action="/login" method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<a onclick="showSignup()">Create Account</a>
</div>

<div id="signupBox" class="hidden">
<h2>Sign Up</h2>
<form action="/signup" method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Create Account</button>
</form>

<a onclick="showLogin()">Back Login</a>
</div>

</div>
</div>

<script>
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("main").style.display="flex";
},2000)

function showSignup(){
loginBox.style.display="none"
signupBox.style.display="block"
}

function showLogin(){
loginBox.style.display="block"
signupBox.style.display="none"
}
</script>

</body>
</html>
