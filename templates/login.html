<!DOCTYPE html>
<html>
<head>
<title>PilgrimFlow AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
overflow:hidden;
}

/* Splash Screen */
#splash{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#2563eb,#06b6d4);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:9999;
}

#splash h1{
font-size:48px;
margin:0;
}

#splash p{
font-size:18px;
opacity:0.9;
}

/* Main */
#main{
display:none;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* Box */
.box{
width:350px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
text-align:center;
max-height:90vh;
overflow-y:auto;
}

.box h2{
margin-bottom:20px;
color:#2563eb;
}

/* Inputs */
input{
width:90%;
padding:10px;
margin:8px;
border:1px solid #ccc;
border-radius:8px;
}

/* Buttons */
button{
width:95%;
padding:10px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

/* Links */
a{
display:block;
margin-top:10px;
color:#2563eb;
cursor:pointer;
text-decoration:none;
font-size:14px;
}

.hidden{
display:none;
}

.admin-box{
margin-top:25px;
padding-top:20px;
border-top:1px solid #ddd;
}
</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
<h1>🛕 PilgrimFlow AI</h1>
<p>Smart Temple Crowd Guidance</p>
</div>

<!-- Main -->
<div id="main">

<div class="box">

<!-- LOGIN -->
<div id="loginBox">

<h2>User Login</h2>

<form action="/login" method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<a onclick="showSignup()">
Create Account
</a>

</div>

<!-- SIGNUP -->
<div id="signupBox" class="hidden">

<h2>Create Account</h2>

<form action="/signup" method="POST">

<input type="text"
name="username"
placeholder="Create Username"
required>

<input type="password"
name="password"
placeholder="Create Password"
required>

<button type="submit">
Sign Up
</button>

</form>

<a onclick="showLogin()">
Back to Login
</a>

</div>

<!-- ADMIN -->
<div class="admin-box">

<h2>Admin Login</h2>

<form action="/admin_login" method="POST">

<input type="text"
name="username"
placeholder="Admin Username"
required>

<input type="password"
name="password"
placeholder="Admin Password"
required>

<button type="submit">
Admin Login
</button>

</form>

</div>

</div>

</div>

<script>

setTimeout(function(){

document.getElementById("splash").style.display="none";

document.getElementById("main").style.display="flex";

},2500);

function showSignup(){

document.getElementById("loginBox").style.display="none";

document.getElementById("signupBox").style.display="block";
}

function showLogin(){

document.getElementById("loginBox").style.display="block";

document.getElementById("signupBox").style.display="none";
}

</script>

</body>
</html>
