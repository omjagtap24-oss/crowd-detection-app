<!DOCTYPE html>
<html>

<head>

<title>PilgrimFlow</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
overflow:hidden;
}

/* SPLASH SCREEN */

#splash{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#2563eb,#06b6d4);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:9999;
}

#splash h1{
font-size:48px;
margin:0;
}

#splash p{
font-size:18px;
opacity:0.9;
}

/* MAIN AREA */

#main{
display:none;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* LOGIN BOX */

.box{
width:360px;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,0.3);
text-align:center;
}

.box h2{
margin-bottom:20px;
color:#2563eb;
}

input{
width:92%;
padding:12px;
margin:8px;
border:1px solid #ccc;
border-radius:10px;
font-size:14px;
}

button{
width:95%;
padding:12px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:15px;
}

button:hover{
background:#1d4ed8;
}

.admin-btn{
background:#ef4444;
}

.admin-btn:hover{
background:#dc2626;
}

a{
display:block;
margin-top:10px;
color:#2563eb;
cursor:pointer;
text-decoration:none;
font-size:14px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<!-- SPLASH -->

<div id="splash">

<h1>🛕 PilgrimFlow AI</h1>

<p>Smart Temple Crowd Guidance</p>

</div>

<!-- MAIN -->

<div id="main">

<div class="box">

<!-- USER LOGIN -->

<div id="loginBox">

<h2>User Login</h2>

<form action="/login" method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<a onclick="showSignup()">
Create Account
</a>

<a onclick="showAdmin()">
Admin Login
</a>

</div>

<!-- SIGNUP -->

<div id="signupBox" class="hidden">

<h2>Create Account</h2>

<form action="/signup" method="POST">

<input
type="text"
name="username"
placeholder="Create Username"
required>

<input
type="password"
name="password"
placeholder="Create Password"
required>

<button type="submit">
Sign Up
</button>

</form>

<a onclick="showLogin()">
Back to Login
</a>

</div>

<!-- ADMIN LOGIN -->

<div id="adminBox" class="hidden">

<h2>Admin Login</h2>

<form action="/admin_login" method="POST">

<input
type="text"
name="username"
placeholder="Admin Username"
required>

<input
type="password"
name="password"
placeholder="Admin Password"
required>

<button
type="submit"
class="admin-btn">

Admin Login

</button>

</form>

<a onclick="showLogin()">
Back to Login
</a>

</div>

</div>

</div>

<script>

setTimeout(function(){

document.getElementById(
"splash"
).style.display = "none";

document.getElementById(
"main"
).style.display = "flex";

}, 2500);

function showSignup(){

document.getElementById(
"loginBox"
).style.display = "none";

document.getElementById(
"signupBox"
).style.display = "block";

document.getElementById(
"adminBox"
).style.display = "none";
}

function showAdmin(){

document.getElementById(
"loginBox"
).style.display = "none";

document.getElementById(
"signupBox"
).style.display = "none";

document.getElementById(
"adminBox"
).style.display = "block";
}

function showLogin(){

document.getElementById(
"loginBox"
).style.display = "block";

document.getElementById(
"signupBox"
).style.display = "none";

document.getElementById(
"adminBox"
).style.display = "none";
}

</script>

</body>
</html>
