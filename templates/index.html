<!-- templates/index.html -->

<!DOCTYPE html>
<html>

<head>

<title>PilgrimFlow AI</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
overflow:hidden;
}

#map{
height:100vh;
width:100%;
}

.top-bar{
position:absolute;
top:0;
width:100%;
padding:14px;
text-align:center;
font-size:22px;
font-weight:bold;
color:white;
background:rgba(0,0,0,0.6);
z-index:1000;
backdrop-filter:blur(10px);
}

.panel{
position:absolute;
top:70px;
left:20px;
width:350px;
padding:15px;
border-radius:15px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(15px);
z-index:1000;
max-height:85vh;
overflow-y:auto;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-bottom:5px;
background:#1c1c1c;
color:white;
box-sizing:border-box;
font-size:14px;
}

button{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.search-btn{
background:#3b82f6;
color:white;
}

.location-btn{
background:#06b6d4;
color:white;
}

.crowd-btn{
background:#ef4444;
color:white;
}

.predict-btn{
background:#22c55e;
color:white;
}

#suggestions{
background:white;
color:black;
border-radius:8px;
max-height:150px;
overflow-y:auto;
margin-bottom:5px;
}

.suggestion-item{
padding:10px;
cursor:pointer;
border-bottom:1px solid #ddd;
}

.suggestion-item:hover{
background:#f1f5f9;
}

#result{
margin-top:12px;
background:white;
color:black;
padding:12px;
border-radius:10px;
font-size:14px;
line-height:1.7;
}

.history-box{
margin-top:15px;
background:white;
padding:10px;
border-radius:10px;
color:black;
}

.history-item{
padding:8px;
margin-bottom:5px;
border-radius:8px;
background:#f1f5f9;
cursor:pointer;
font-size:13px;
}

.history-item:hover{
background:#dbeafe;
}

.badge{
padding:4px 8px;
border-radius:6px;
color:white;
font-weight:bold;
}

.low{
background:#22c55e;
}

.medium{
background:#f59e0b;
}

.high{
background:#ef4444;
}

</style>

</head>

<body>

<div class="top-bar">
🛕 PilgrimFlow AI
</div>

<div class="panel">

<input
type="text"
id="search"
placeholder="Search Temple..."
oninput="showSuggestions()">

<div id="suggestions"></div>

<button
class="search-btn"
onclick="searchTemple()">

🔍 Search Temple

</button>

<button
class="location-btn"
onclick="useLocation()">

📍 Use My Location

</button>

<button
class="crowd-btn"
onclick="getCrowd()">

🚦 Check Crowd

</button>

<button
class="predict-btn"
onclick="getPrediction()">

⏰ Best Time

</button>

<div id="result">

Search any temple to begin.

</div>

<div class="history-box">

<h3>🕘 Recent Searches</h3>

<div id="historyList">
No searches yet
</div>

</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([20.5937, 78.9629], 5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

var currentMarker = null;

var selectedTemple = "";

let typingTimer;


// ---------------- LIVE GPS TRACKING ----------------

if(navigator.geolocation){

navigator.geolocation.watchPosition(function(position){

fetch("/update_location", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

lat: position.coords.latitude,
lon: position.coords.longitude

})

});

});

}


// ---------------- BADGE ----------------

function getBadge(level){

if(level === "High"){
return "<span class='badge high'>High</span>";
}

if(level === "Medium"){
return "<span class='badge medium'>Medium</span>";
}

return "<span class='badge low'>Low</span>";
}


// ---------------- SHOW RESULT ----------------

function showResult(data){

document.getElementById("result").innerHTML =

"<b>" + data.temple + "</b><br><br>" +

"👥 Nearby People: " + data.people + "<br>" +

"🏟 Capacity: " + data.capacity + "<br>" +

"📡 Detection Radius: " + data.radius + " meters<br>" +

"📊 Crowd Score: " + data.score + "%<br><br>" +

"🚦 Crowd Level: " +

getBadge(data.crowd_level) +

"<br><br>" +

"💡 " + data.suggestion;
}


// ---------------- SEARCH TEMPLE ----------------

function searchTemple(){

var query =
document.getElementById("search").value.trim();

if(query === ""){

alert("Enter temple name");

return;
}

fetch(
"/search_temple?query=" +
encodeURIComponent(query)
)

.then(response => response.json())

.then(data => {

if(data.length === 0){

alert("Temple not found");

return;
}

let temple = data[0];

let lat = parseFloat(temple.lat);

let lon = parseFloat(temple.lon);

if(currentMarker){
map.removeLayer(currentMarker);
}

currentMarker = L.marker([lat, lon])
.addTo(map)
.bindPopup(temple.name)
.openPopup();

map.flyTo([lat, lon], 15);

selectedTemple = temple.name;

saveSearch(temple.name);

document.getElementById(
"suggestions"
).innerHTML = "";

})

.catch(error => {

console.log(error);

alert("Search failed");

});
}


// ---------------- AUTO SUGGESTIONS ----------------

function showSuggestions(){

clearTimeout(typingTimer);

typingTimer = setTimeout(() => {

let query =
document.getElementById("search").value.trim();

if(query.length < 2){

document.getElementById(
"suggestions"
).innerHTML = "";

return;
}

fetch(
"/search_temple?query=" +
encodeURIComponent(query)
)

.then(res => res.json())

.then(data => {

let html = "";

data.forEach((place, index) => {

window["temple_" + index] = place;

html += `
<div
class="suggestion-item"
onclick="selectSuggestion(${index})">

${place.name}

</div>
`;
});

document.getElementById(
"suggestions"
).innerHTML = html;
});

}, 600);
}


// ---------------- SELECT SUGGESTION ----------------

function selectSuggestion(index){

let place = window["temple_" + index];

if(!place) return;

let lat = parseFloat(place.lat);

let lon = parseFloat(place.lon);

document.getElementById(
"search"
).value = place.name;

document.getElementById(
"suggestions"
).innerHTML = "";

if(currentMarker){
map.removeLayer(currentMarker);
}

currentMarker = L.marker([lat, lon])
.addTo(map)
.bindPopup(place.name)
.openPopup();

map.flyTo([lat, lon], 15);

selectedTemple = place.name;

saveSearch(place.name);
}


// ---------------- USER LOCATION ----------------

function useLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(position){

let lat = position.coords.latitude;

let lon = position.coords.longitude;

map.flyTo([lat, lon], 15);

if(currentMarker){
map.removeLayer(currentMarker);
}

currentMarker = L.marker([lat, lon])
.addTo(map)
.bindPopup("You are here")
.openPopup();

});
}
}


// ---------------- CROWD ----------------

function getCrowd(){

if(!selectedTemple){

alert("Search a temple first");

return;
}

fetch(
"/crowd/" +
encodeURIComponent(selectedTemple)
)

.then(res => res.json())

.then(data => {

showResult(data);

});
}


// ---------------- BEST TIME ----------------

function getPrediction(){

if(!selectedTemple){

alert("Search a temple first");

return;
}

fetch(
"/predict/" +
encodeURIComponent(selectedTemple)
)

.then(res => res.json())

.then(data => {

document.getElementById(
"result"
).innerHTML =

"<b>" +
data.temple +
"</b><br><br>" +

"⏰ Best Time:<br><br>" +

data.best_time;

});
}


// ---------------- SEARCH HISTORY ----------------

function saveSearch(name){

fetch(
"/save_search/" +
encodeURIComponent(name)
);

loadHistory();
}

function loadHistory(){

fetch("/history")

.then(res => res.json())

.then(data => {

let html = "";

if(data.length === 0){

html = "No searches yet";
}

else{

data.forEach(item => {

const safeItem =
item
.replace(/'/g, "\\'")
.replace(/"/g, "&quot;");

html += `
<div
class="history-item"
onclick="searchFromHistory('${safeItem}')">

${item}

</div>
`;
});
}

document.getElementById(
"historyList"
).innerHTML = html;
});
}

function searchFromHistory(name){

document.getElementById(
"search"
).value = name;

searchTemple();
}

loadHistory();

</script>

</body>
</html>
