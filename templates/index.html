<!DOCTYPE html>
<html>
<head>
<title>PilgrimFlow Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#1e293b;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:90%;
max-width:1100px;
margin:auto;
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logout{
background:#ef4444;
padding:10px 16px;
border-radius:8px;
text-decoration:none;
color:white;
}

.box{
background:#1e293b;
padding:25px;
border-radius:14px;
margin-bottom:25px;
}

input{
width:70%;
padding:12px;
border:none;
border-radius:8px;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
margin-left:8px;
margin-top:10px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:14px;
}

.result{
margin-top:15px;
background:#334155;
padding:15px;
border-radius:10px;
display:none;
}

.small{
font-size:13px;
color:#cbd5e1;
}

@media(max-width:768px){
.cards{
grid-template-columns:1fr;
}

input{
width:100%;
margin-bottom:10px;
}

button{
width:100%;
margin-left:0;
}
}
</style>
</head>

<body>

<header>🛕 PilgrimFlow</header>

<div class="container">

<div class="topbar">
<h3>Welcome, {{ username }}</h3>
<a href="/logout" class="logout">Logout</a>
</div>

<div class="box">
<h2>Search Temple</h2>

<form action="/search" method="POST">
<input type="text" name="temple" id="templeInput" placeholder="Enter temple name..." required>
<button type="submit">Search</button>
</form>

<button onclick="checkCrowd()">Check Crowd</button>
<button onclick="bestTime()">Best Time</button>

<div id="resultBox" class="result"></div>
</div>

<div class="cards">

<div class="card">
<h3>🕘 Recent Searches</h3>
<ul id="recentList">
<li>Loading...</li>
</ul>
</div>

<div class="card">
<h3>📍 About PilgrimFlow</h3>
<p>Plan smarter temple visits with crowd insights and best time recommendations.</p>
</div>

</div>

</div>

<script>

loadRecents();

function loadRecents(){
fetch("/recents")
.then(res => res.json())
.then(data => {

let box = document.getElementById("recentList");
box.innerHTML = "";

if(data.length == 0){
box.innerHTML = "<li>No recent searches</li>";
return;
}

data.forEach(item=>{
box.innerHTML += `
<li>
<b>${item.temple}</b><br>
<span class="small">${item.time}</span>
</li>
`;
});

});
}

function checkCrowd(){
let temple = document.getElementById("templeInput").value;

if(temple==""){
alert("Enter temple name");
return;
}

fetch("/crowd/" + temple)
.then(res => res.json())
.then(data => {
document.getElementById("resultBox").style.display="block";
document.getElementById("resultBox").innerHTML = `
<b>Temple:</b> ${data.temple}<br>
<b>Crowd Level:</b> ${data.crowd_level}<br>
<b>Suggestion:</b> ${data.suggestion}
`;
});
}

function bestTime(){
let temple = document.getElementById("templeInput").value;

if(temple==""){
alert("Enter temple name");
return;
}

fetch("/predict/" + temple)
.then(res => res.json())
.then(data => {
document.getElementById("resultBox").style.display="block";
document.getElementById("resultBox").innerHTML = `
<b>Temple:</b> ${data.temple}<br>
<b>Best Time:</b> ${data.best_time}
`;
});
}

</script>

</body>
</html>
