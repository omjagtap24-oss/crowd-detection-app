<!DOCTYPE html>
<html>
<head>
<title>PilgrimFlow</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

#map{
height:100vh;
width:100%;
}

.top{
position:absolute;
top:0;
width:100%;
padding:12px;
text-align:center;
background:rgba(0,0,0,0.6);
z-index:1000;
}

.panel{
position:absolute;
top:60px;
left:20px;
width:320px;
padding:15px;
border-radius:15px;
background:rgba(255,255,255,0.12);
z-index:1000;
}

input,button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
}

#history{
margin-top:10px;
font-size:14px;
}

#result{
margin-top:10px;
font-size:14px;
}
</style>
</head>

<body>

<div class="top">
🛕 PilgrimFlow | Welcome {{username}}
<a href="/logout" style="color:white;float:right;margin-right:20px;">Logout</a>
</div>

<div class="panel">

<input type="text" id="search" placeholder="Search temple">

<button onclick="searchTemple()">Search Temple</button>
<button onclick="getCrowd()">Check Crowd</button>
<button onclick="bestTime()">Best Time</button>
<button onclick="loadHistory()">Recent Searches</button>

<div id="result"></div>
<div id="history"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([20.5937,78.9629],5)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)

var selectedTemple="Shirdi"

function searchTemple(){
let temple=document.getElementById("search").value
selectedTemple=temple

fetch("https://nominatim.openstreetmap.org/search?format=json&q="+temple+" temple india")
.then(res=>res.json())
.then(data=>{
if(data.length>0){
let lat=data[0].lat
let lon=data[0].lon

map.setView([lat,lon],13)

L.marker([lat,lon]).addTo(map)
.bindPopup(temple)
.openPopup()

fetch('/save_search/'+temple)
}
})
}

function getCrowd(){
fetch('/crowd/'+selectedTemple)
.then(res=>res.json())
.then(data=>{
document.getElementById("result").innerHTML="<b>"+data.temple+"</b><br>"+
"Crowd: "+data.crowd_level+"<br>"+data.suggestion
})
}

function bestTime(){
fetch('/predict/'+selectedTemple)
.then(res=>res.json())
.then(data=>{
document.getElementById("result").innerHTML="<b>"+data.temple+"</b><br>"+
"Best Time: "+data.best_time
})
}

function loadHistory(){
fetch('/history')
.then(res=>res.json())
.then(data=>{
let html="<b>Recent Searches:</b><br>"
data.forEach(x=>{
html += x+"<br>"
})
document.getElementById("history").innerHTML=html
})
}
</script>

</body>
</html>
